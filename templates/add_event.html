{% extends 'base.html' %}
{% block title %}Add Event{% endblock %}
{% block page_title %}Add Event{% endblock %}
{% block content %}
<div class="card p-4" style="max-width:600px;">
    <h5 class="fw-bold mb-3">Create New Event</h5>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold">Title *</label>
            <input type="text" name="title" class="form-control" required>
        </div>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label fw-semibold">Date *</label>
                <input type="date" name="event_date" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Location</label>
                <input type="text" name="location" class="form-control">
            </div>
        </div>
        <div class="mb-3 mt-3">
            <label class="form-label fw-semibold">Organizer</label>
            <input type="text" name="organizer" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Description</label>
            <textarea name="description" class="form-control" rows="4"></textarea>
        </div>
        <button type="submit" class="btn btn-primary px-4 fw-semibold">Create Event</button>
        <a href="{{ url_for('events') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
    </form>
</div>
{% endblock %}
