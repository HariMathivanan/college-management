{% extends 'base.html' %}
{% block auth_content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #f6d51a, #fff176);">
  <div class="card p-4" style="width:420px;">
    <div class="text-center mb-4">
      <i class="bi bi-person-lines-fill text-warning" style="font-size:3rem;"></i>
      <h4 class="fw-bold mt-2">Staff Login</h4>
      <p class="text-muted small">Authorized staff members</p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat,msg in messages %}<div class="alert alert-{{cat}} py-2">{{msg}}</div>{% endfor %}
    {% endwith %}
    <form method="POST">
      <div class="mb-3"><label class="form-label fw-semibold">Email</label><input type="email" name="email" class="form-control" required></div>
      <div class="mb-3"><label class="form-label fw-semibold">Password</label><input type="password" name="password" class="form-control" required></div>
      <button type="submit" class="btn btn-warning w-100 py-2 fw-semibold">Login as Staff</button>
    </form>
    <p class="text-center mt-3 small text-muted">New staff? <a href="{{ url_for('staff_register') }}">Register here</a></p>
    <p class="text-center small text-muted"><a href="{{ url_for('home') }}">← Back to portal selection</a></p>
    <!-- <div class="text-center mt-1 p-2 rounded" style="background:#f0fff4;font-size:0.78rem;"><strong>Demo:</strong> ram@example.com / admin123</div>
  </div> -->
</div>
{% endblock %}
