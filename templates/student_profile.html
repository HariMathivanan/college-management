{% extends 'base.html' %}
{% block title %}My Profile{% endblock %}
{% block page_title %}My Profile{% endblock %}
{% block content %}
<div class="card p-4" style="max-width:700px;">
  <div class="d-flex align-items-center gap-3 mb-4">
    <div class="avatar" style="width:60px;height:60px;font-size:1.6rem;background:#1b5e20;">{{session.name[0].upper()}}</div>
    <div><h5 class="mb-0 fw-bold">{{student.name}}</h5><div class="text-muted small">{{student.department}} | Enrolled {{student.enrollment_year}} | Roll: {{student.roll_number or 'N/A'}}</div></div>
  </div>
  <form method="POST">
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label fw-semibold">Phone</label><input type="text" name="phone" class="form-control" value="{{student.phone or ''}}"></div>
      <div class="col-md-6"><label class="form-label fw-semibold">LinkedIn</label><input type="url" name="linkedin" class="form-control" value="{{student.linkedin or ''}}"></div>
      <div class="col-12"><label class="form-label fw-semibold">Skills</label><input type="text" name="skills" class="form-control" value="{{student.skills or ''}}" placeholder="Python, SQL, Machine Learning..."></div>
      <div class="col-12"><label class="form-label fw-semibold">Bio / About</label><textarea name="bio" class="form-control" rows="4" placeholder="Tell alumni about yourself...">{{student.bio or ''}}</textarea></div>
      <div class="col-12"><button type="submit" class="btn btn-success px-4 fw-semibold">Save Changes</button></div>
    </div>
  </form>
</div>
{% endblock %}
