{% extends 'base.html' %}
{% block title %}My Profile{% endblock %}
{% block page_title %}My Profile{% endblock %}
{% block content %}
<div class="card p-4" style="max-width:700px;">
  <div class="d-flex align-items-center gap-3 mb-4">
    <div class="avatar" style="width:60px;height:60px;font-size:1.6rem;background:#1a237e;">{{session.name[0].upper()}}</div>
    <div><h5 class="mb-0 fw-bold">{{alumnus.name}}</h5><div class="text-muted small">{{alumnus.department}} | Batch {{alumnus.batch_year}}</div></div>
  </div>
  <form method="POST">
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label fw-semibold">Phone</label><input type="text" name="phone" class="form-control" value="{{alumnus.phone or ''}}"></div>
      <div class="col-md-6"><label class="form-label fw-semibold">City</label><input type="text" name="city" class="form-control" value="{{alumnus.city or ''}}"></div>
      <div class="col-md-6"><label class="form-label fw-semibold">Company</label><input type="text" name="company" class="form-control" value="{{alumnus.company or ''}}"></div>
      <div class="col-md-6"><label class="form-label fw-semibold">Job Title</label><input type="text" name="job_title" class="form-control" value="{{alumnus.job_title or ''}}"></div>
      <div class="col-12"><label class="form-label fw-semibold">LinkedIn</label><input type="url" name="linkedin" class="form-control" value="{{alumnus.linkedin or ''}}"></div>
      <div class="col-12"><label class="form-label fw-semibold">Bio</label><textarea name="bio" class="form-control" rows="4">{{alumnus.bio or ''}}</textarea></div>
      <div class="col-12"><button type="submit" class="btn btn-primary px-4 fw-semibold">Save Changes</button></div>
    </div>
  </form>
</div>
{% endblock %}
